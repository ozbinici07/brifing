name: Update Firestore usage summary
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firestore-usage.yml'
      - 'scripts/update-firestore-usage.mjs'
      - 'scripts/firestore-usage-core.mjs'
permissions:
  contents: read
concurrency:
  group: firestore-usage-summary
  cancel-in-progress: false
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRIFINGBILGISISTEMI }}
      - run: node scripts/update-firestore-usage.mjs --application-default
