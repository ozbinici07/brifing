name: Update private Firebase usage
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/firestore-usage-core.mjs'
      - 'scripts/update-firestore-usage.mjs'
      - '.github/workflows/firestore-usage.yml'
permissions:
  contents: read
concurrency:
  group: firebase-usage-snapshot
  cancel-in-progress: false
jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update admin-only usage snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRIFINGBILGISISTEMI }}
        run: node scripts/update-firestore-usage.mjs
